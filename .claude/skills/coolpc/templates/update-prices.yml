name: 更新原價屋報價

on:
  schedule:
    - cron: "30 3 * * *"   # 每天 11:30 (台灣時間) 抓一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下載並解析原價屋估價頁
        run: python3 .claude/skills/coolpc/scripts/fetch_coolpc.py --out .

      - name: 重新產出估價單與網頁資料
        run: |
          BUILDS=$(python3 -c "import json;print(' '.join(f'builds/{k}.json' for k in json.load(open('site.json'))['builds']))")
          python3 .claude/skills/coolpc/scripts/quote.py --summary $BUILDS > quote.md
          python3 .claude/skills/coolpc/scripts/build_site.py

      - name: 提交變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只有原價屋資料真的變了才提交 (docs/data.json 的 generated 時間戳每次都會變, 不算)
          if git diff --quiet -- data quote.md; then
            echo "報價無變化"
            git checkout -- docs/data.json
          else
            git add data docs/data.json quote.md
            QD=$(python3 -c "import json;print(json.load(open('data/coolpc_prices.json'))['quote_date'])")
            git commit -m "更新原價屋報價 ($QD)"
            git push
          fi
