name: 更新原價屋報價

on:
  schedule:
    - cron: "30 3 * * *"   # 每天 11:30 (台灣時間) 抓一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下載並解析原價屋估價頁
        run: python3 scripts/fetch_coolpc.py --out .

      - name: 重新產出估價單與網頁資料
        run: |
          python3 scripts/quote.py builds/low.json builds/mid.json builds/high.json > quote.md
          python3 scripts/build_site.py

      - name: 提交變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json quote.md
          if git diff --cached --quiet; then
            echo "報價無變化"
          else
            QD=$(python3 -c "import json;print(json.load(open('data/coolpc_prices.json'))['quote_date'])")
            git commit -m "更新原價屋報價 ($QD)"
            git push
          fi
