name: 更新原價屋報價

on:
  schedule:
    - cron: "30 * * * *"   # 每小時 :30 抓一次 (報價沒變就不會 commit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下載並解析原價屋估價頁
        run: python3 .claude/skills/coolpc/scripts/fetch_coolpc.py --out .

      - name: 重新產出估價單與網頁資料
        run: |
          BUILDS=$(python3 -c "import json;print(' '.join(f'builds/{k}.json' for k in json.load(open('site.json'))['builds']))")
          python3 .claude/skills/coolpc/scripts/quote.py --summary $BUILDS > quote.md
          python3 .claude/skills/coolpc/scripts/build_site.py

      - name: 提交變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只有內容真的變了才提交 (build_site.py 在內容沒變時會沿用上次的 generated 時間戳)
          # 先 add 再比 staged：新產生的 docs/data-more.json 也算；site.json 關掉全部分類時沒有這個檔也不會出錯
          git add -A -- data docs quote.md
          if git diff --cached --quiet; then
            echo "報價無變化"
          else
            QD=$(python3 -c "import json;print(json.load(open('data/coolpc_prices.json'))['quote_date'])")
            git commit -m "更新原價屋報價 ($QD)"
            git push
          fi
