name: 測試

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/data.json"
      - "docs/data-more.json"
      - "docs/history.json"
      - "docs/graph/**"
      - "quote.md"
  pull_request:
    paths-ignore:
      - "data/**"
      - "docs/data.json"
      - "docs/data-more.json"
      - "docs/history.json"
      - "docs/graph/**"
      - "quote.md"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 網頁 JS 測試 (coolpc-live / builder-ui)
        run: node --test '.claude/skills/coolpc/tests/*.test.js'   # Node 22 的 --test 不吃目錄, 用 glob

      - name: 抓價與建站腳本測試
        run: python3 -m unittest discover -s .claude/skills/coolpc/tests

      # 測試跑的是 templates/ 副本, docs/ 若只改一邊測試照樣會過, 所以要求兩邊一致
      - name: docs/ 與 templates/ 介面檔一致
        run: |
          for f in builder-ui.js coolpc-live.js builder.css; do
            diff -u ".claude/skills/coolpc/templates/$f" "docs/$f" || { echo "::error::docs/$f 與 templates/$f 不一致"; exit 1; }
          done
